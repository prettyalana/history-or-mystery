services:
  - type: web
    name: history_or_mystery
    plan: free
    env: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "./bin/render-start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: history_or_mystery
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false